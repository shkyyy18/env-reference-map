[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "env-reference-map"
version = "0.1.0"
description = "Map literal Python environment references to declared key names"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "env-reference-map contributors"}]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]
[project.scripts]
env-reference-map = "env_reference_map.__main__:cli"
[project.urls]
Repository = "https://github.com/shkyyy18/env-reference-map"
[tool.setuptools.packages.find]
where = ["src"]
